<!doctype html>
<html lang="ru" data-plus-theme="slate" data-font-mode="dfo">
<head>
<meta charset="utf-8">
<title>DFO-Client-Expander-RU</title>
<link rel="icon" href="data:,">
<style id="dfo-embedded-fonts">
@font-face { font-family: 'DFO Gabin'; src: url('/fonts/item-font-text.ttf') format('truetype'); font-display: block; }
@font-face { font-family: 'DFO Greengoth'; src: url('/fonts/item-font-title.ttf') format('truetype'); font-display: block; }
@font-face { font-family: 'DFO Flexi'; src: url('/fonts/item-font-numbers.ttf') format('truetype'); font-display: block; }
@font-face { font-family: 'DFO Hangyaku'; src: url('/fonts/book-font-text.ttf') format('truetype'); font-display: block; }
@font-face { font-family: 'DFO Ckazka'; src: url('/fonts/item-font-sigil.ttf') format('truetype'); font-display: block; }
@font-face { font-family: 'DFO Ritalin'; src: url('/fonts/item-font-set.ttf') format('truetype'); font-display: block; }
@font-face { font-family: 'DFO Wolga'; src: url('/fonts/item-font-legendary.otf') format('opentype'); font-display: block; }
@font-face { font-family: 'DFO Flow'; src: url('/fonts/item-font-description.otf') format('opentype'); font-display: block; }
</style>
<link rel="stylesheet" href="/ui/installer-styles.css">
</head>
<body>
<div class="inst-window-shell chrome-custom bg-balanced is-production" id="inst-window">

  <!-- [L-01] Global Outer Window Frame (FRAME1) -->
  <div class="inst-root" id="inst-root">

    <!-- 1. Top General Information Panel (draggable header bar) -->
    <header class="inst-header" id="inst-header">
      <div class="inst-head-brand">
        <div class="inst-crest" id="inst-crest"></div>
        <div class="inst-brand-text">
          <div class="inst-title-row">
            <h1 class="inst-title" id="inst-title">DFO-Client-Expander-RU</h1>
          </div>
          <div class="inst-subtitle-row">
            <span class="inst-author" id="inst-author"></span>
            <span class="inst-sep-dot">◆</span>
            <span class="inst-community" id="inst-community"></span>
          </div>
        </div>
      </div>

      <div class="inst-head-right">
        <button type="button" class="dfo-ornate-btn primary is-sm inst-fonts-btn" id="btn-fonts"></button>
        <button type="button" class="dfo-ornate-btn is-sm" id="btn-journal"></button>
        <button type="button" class="dfo-ornate-btn is-sm inst-update-pill" id="btn-updates"></button>
        <span class="inst-win-ctrl-sep"></span>
        <button type="button" class="dfo-ornate-btn is-sm inst-sound-btn" id="btn-sound"></button>
        <button type="button" class="dfo-ornate-btn lang-accent is-sm" id="btn-lang"></button>
        <span class="inst-win-ctrl-sep inst-cap-sep"></span>
        <div class="inst-win-ctrls">
          <button type="button" class="dfo-ornate-btn inst-cap-rpg" id="btn-rpg-min" title="Свернуть">—</button>
          <button type="button" class="dfo-ornate-btn close inst-cap-rpg" id="btn-rpg-close" title="Закрыть">✕</button>
        </div>
      </div>
    </header>

    <!-- 2. Middle Dungeon Art Stage (Living Pixel-Art Canvas lives strictly here) -->
    <main class="inst-stage" id="inst-stage">
      <canvas class="inst-dungeon-bg" id="dungeon-bg-canvas"></canvas>
      <div class="inst-dungeon-vignette"></div>

      <!-- Left Open Space over the Living Scene (GitHub update alert on new release) -->
      <section class="inst-left-stage" id="inst-left-stage" aria-live="polite">
        <div class="inst-github-alert" id="inst-github-alert">
          <div class="inst-gha-eyebrow">
            <span class="inst-gha-beacon"></span>
            <span id="inst-gha-kicker">GITHUB RELEASES</span>
          </div>
          <h2 class="inst-gha-headline" id="inst-gha-headline">ДОСТУПНА НОВАЯ ВЕРСИЯ</h2>
          <div class="inst-gha-ver-row">
            <span class="inst-gha-cur" id="inst-gha-cur">v1.30.0</span>
            <span class="inst-gha-arrow">→</span>
            <span class="inst-gha-new" id="inst-gha-new">v1.31.0</span>
          </div>
          <p class="inst-gha-msg" id="inst-gha-msg"></p>
          <div class="inst-gha-actions">
            <button type="button" class="dfo-ornate-btn is-ready" id="btn-gha-update"></button>
            <button type="button" class="dfo-ornate-btn" id="btn-gha-dismiss"></button>
          </div>
        </div>
      </section>

      <!-- Right Rail: Top-Right Glowing "Say Thanks" + Bottom-Right Collapsible Option Chips -->
      <aside class="inst-options-rail" id="inst-options-rail">
        <div class="inst-thanks-dock is-peeking" id="inst-thanks-dock">
          <button type="button" class="dfo-ornate-btn inst-thanks-btn" id="btn-thanks"></button>
        </div>
        <div class="inst-options-drawer" id="inst-options-drawer">
          <div class="inst-options-clip" id="inst-options-clip">
            <div class="inst-options-col" id="components-list"></div>
          </div>
          <div class="inst-collapse-bar" id="inst-collapse-bar">
            <div class="inst-collapse-track">
              <div class="inst-collapse-line" id="inst-collapse-line"></div>
            </div>
            <button type="button" class="dfo-ornate-btn inst-collapse-btn" id="btn-collapse-opts" aria-expanded="true">
              <span class="inst-tri-ico" id="inst-collapse-tri"></span>
            </button>
          </div>
        </div>
      </aside>
    </main>

    <!-- 3. Separate Bottom Panel BELOW Graphics -->
    <footer class="inst-footer-panel" id="inst-footer-panel">
      <div class="inst-search-row" id="inst-search-row">
        <div class="inst-path-well dfo-well-frame" id="inst-path-well">
          <span class="inst-status-dot" id="inst-status-dot"></span>
          <span class="inst-path-ico" id="inst-path-ico"></span>
          <input class="inst-path-input" id="inst-path-input" type="text" readonly>
        </div>
        <button type="button" class="dfo-ornate-btn is-sm inst-dock-btn" id="btn-browse"></button>
        <button type="button" class="dfo-ornate-btn is-sm inst-dock-btn" id="btn-refresh"></button>
        <button type="button" class="dfo-ornate-btn danger is-sm inst-dock-btn is-hidden" id="btn-uninstall"></button>
      </div>

      <div class="inst-progress-wrap" id="inst-progress-wrap">
        <div class="inst-vb-progress" id="inst-progress-track">
          <div class="inst-vb-progress-fill" id="inst-progress-fill"></div>
          <div class="inst-vb-progress-overlay">
            <span class="inst-note-main" id="inst-note-main"></span>
            <span class="inst-pct-readout" id="inst-pct-readout"></span>
          </div>
        </div>
      </div>

      <section class="inst-info-plaque" id="inst-info-plaque" aria-live="polite">
        <div class="dfo-res-chip inst-info-ver-box is-gold" id="inst-info-ver-box">
          <span class="inst-info-ver-main">
            <span class="inst-info-ver-k" id="inst-ver-label">ВЕР</span>
            <span class="dfo-res-val inst-ver-plaque" id="inst-ver-plaque">v1.30.0</span>
          </span>
          <span class="dfo-res-ico inst-ver-ico" id="inst-ver-ico"></span>
        </div>
        <div class="inst-info-status-plaque is-tone-teal" id="inst-info-status-plaque">
          <span class="inst-status-dot" id="inst-info-dot"></span>
          <span class="inst-status-plaque-txt" id="inst-client-chip">КЛИЕНТ ГОТОВ</span>
        </div>
      </section>

      <button type="button" class="dfo-ornate-btn is-cta is-ready inst-big-install" id="btn-install"></button>
    </footer>

    <!-- Floating [O-01] Canonical Hover Tooltip Host -->
    <div class="inst-tooltip-layer" id="inst-tooltip-layer"></div>

    <!-- 4. Separate Dialog: Font Replacement & Customization (8 unified categories) -->
    <div class="inst-modal-backdrop" id="inst-fonts-backdrop">
      <div class="inst-dialog-box inst-fonts-dialog dfo-accent-panel dfo-accent-sapphire" id="inst-fonts-dialog" role="dialog" aria-modal="true">
        <div class="dfo-accent-head">
          <h3 class="dfo-accent-title" id="inst-fonts-title"></h3>
          <span class="dfo-chip chip-blue" id="inst-fonts-summary"></span>
        </div>
        <div class="inst-fonts-dialog-body">
          <div class="inst-fonts-scroll dfo-scroll" id="fonts-list"></div>
        </div>
        <div class="inst-fonts-toolbar">
          <div class="inst-fonts-tools-left">
            <button type="button" class="dfo-ornate-btn is-sm" id="btn-fonts-all"></button>
            <button type="button" class="dfo-ornate-btn is-sm danger" id="btn-fonts-reset"></button>
            <button type="button" class="dfo-ornate-btn is-sm" id="btn-fonts-import"></button>
            <button type="button" class="dfo-ornate-btn is-sm" id="btn-fonts-export"></button>
            <button type="button" class="dfo-ornate-btn is-sm" id="btn-fonts-dir"></button>
          </div>
          <button type="button" class="dfo-ornate-btn close" id="btn-fonts-close"></button>
        </div>
      </div>
    </div>

    <!-- 5. Separate Dialog: Session Journal & Reports -->
    <div class="inst-modal-backdrop" id="inst-journal-backdrop">
      <div class="inst-dialog-box inst-journal-dialog dfo-accent-panel" id="inst-journal-dialog" role="dialog" aria-modal="true">
        <div class="dfo-accent-head">
          <h3 class="dfo-accent-title" id="inst-journal-title"></h3>
          <span class="dfo-chip chip-muted" id="inst-journal-chip">dfo-mod-installer.log</span>
        </div>
        <div class="inst-journal-body">
          <div class="inst-log-well dfo-well-frame dfo-scroll" id="inst-log-well"></div>
        </div>
        <div class="inst-journal-toolbar">
          <div class="inst-journal-tools-left">
            <button type="button" class="dfo-ornate-btn is-sm" id="btn-save-log"></button>
            <button type="button" class="dfo-ornate-btn is-sm" id="btn-open-log"></button>
            <button type="button" class="dfo-ornate-btn is-sm" id="btn-open-report"></button>
            <button type="button" class="dfo-ornate-btn is-sm" id="btn-installer-log"></button>
          </div>
          <button type="button" class="dfo-ornate-btn close" id="btn-journal-close"></button>
        </div>
      </div>
    </div>

    <!-- 6. Separate Dialog: Say Thanks / Support Author -->
    <div class="inst-modal-backdrop" id="inst-thanks-backdrop">
      <div class="inst-dialog-box inst-thanks-dialog dfo-accent-panel" id="inst-thanks-dialog" role="dialog" aria-modal="true">
        <div class="dfo-accent-head">
          <h3 class="dfo-accent-title" id="inst-thanks-title"></h3>
          <span class="dfo-chip chip-gold" id="inst-thanks-badge"></span>
        </div>
        <div class="inst-thanks-body" id="inst-thanks-body"></div>
        <div class="inst-thanks-toolbar">
          <span class="inst-thanks-foot-note" id="inst-thanks-foot-note"></span>
          <button type="button" class="dfo-ornate-btn close" id="btn-thanks-close"></button>
        </div>
      </div>
    </div>

    <!-- In-Window DFO Game Cursor & Glowing Neon Trail + Bloom Layer -->
    <canvas class="inst-cursor-fx-canvas" id="inst-cursor-fx" aria-hidden="true"></canvas>
    <div class="inst-game-cursor" id="inst-game-cursor" aria-hidden="true"></div>

  </div>
</div>

<script src="/ui/installer-scene.js"></script>
<script src="/ui/installer-app.js"></script>
</body>
</html>
