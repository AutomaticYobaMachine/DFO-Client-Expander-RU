name: Windows installer build

on:
  push:
    branches:
      - main
      - fix/inventory-window-single-row-2026-11-08
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Read the installer version
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re
          version = json.loads(pathlib.Path('src/mod/version.json').read_text())['version']
          if not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', version):
              raise SystemExit(f'Invalid installer version: {version!r}')
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'BUILD_VERSION={version}\n')
          PY

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.3'
          cache: false

      - name: Build the standalone Windows installer
        run: sh tools/build.sh

      - name: Check installer options, item cards and packaged install/uninstall
        shell: bash
        run: |
          (cd src/gui && go test ./...)
          node --test test/font-assets.test.cjs test/fonts.test.cjs test/item-cards.test.cjs test/item-text.test.cjs test/packaging.test.cjs test/service-windows.test.cjs test/loot-input.test.cjs test/loot-access.test.cjs test/loot-hosts.test.cjs test/loot-physical.test.cjs test/loot-sources.test.cjs test/local-import.test.cjs test/dungeon-intel.test.cjs test/dungeon-live.test.cjs test/dungeon-navigation.test.cjs test/dungeon-quest-navigation.test.cjs test/dungeon-graph.test.cjs test/dungeon-complex.test.cjs test/dungeon-shafts.test.cjs test/ui-text.test.cjs test/pack.test.cjs test/inventory-layout.test.cjs
          (cd dist && sha256sum --check "DFO-Client-Expander-RU-$BUILD_VERSION.exe.sha256")

      - name: Keep the EXE and checksum without publishing a release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: DFO-Client-Expander-RU-${{ env.BUILD_VERSION }}-windows-x64
          path: |
            dist/DFO-Client-Expander-RU-${{ env.BUILD_VERSION }}.exe
            dist/DFO-Client-Expander-RU-${{ env.BUILD_VERSION }}.exe.sha256
          if-no-files-found: error
          compression-level: 9
          retention-days: 30
